{{- if not .Values.secrets.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "gimi.secretName" . }}
  labels:
    {{- include "gimi.labels" . | nindent 4 }}
type: Opaque
stringData:
  postgres-url: {{ include "gimi.postgresUrl" . | quote }}
  postgres-username: "gimi"
  postgres-password: {{ default (randAlphaNum 24) .Values.postgresql.external.password | quote }}
  jwt-secret: {{ default (randAlphaNum 32) .Values.secrets.jwtSecret | quote }}
  webhook-secret: {{ default (randAlphaNum 16) .Values.secrets.webhookSecret | quote }}
  redis-url: {{ include "gimi.redisUrl" . | quote }}
  admin-password: {{ default (randAlphaNum 16) .Values.secrets.adminPassword | quote }}
  worker-token: {{ default (randAlphaNum 24) .Values.secrets.workerToken | quote }}
{{- end }}
{{- if .Values.ingress.enabled }}
---
{{- if .Values.ingress.tls.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "gimi.fullname" . }}
  labels:
    {{- include "gimi.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "gimi.fullname" . }}-server
                port:
                  number: {{ .Values.server.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "gimi.fullname" . }}-ui
                port:
                  number: 80
{{- end }}
{{- end }}
