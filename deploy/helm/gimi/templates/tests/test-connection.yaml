apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "gimi.fullname" . }}-test-connection"
  labels:
    {{- include "gimi.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ['wget']
      args: ['{{ include "gimi.fullname" . }}-server:{{ .Values.server.port }}/actuator/health']
  restartPolicy: Never
