apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "gimi.fullname" . }}-server
  labels:
    {{- include "gimi.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "gimi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "gimi.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "gimi.fullname" . }}-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: {{ include "gimi.serverImage" . }}
          imagePullPolicy: {{ .Values.server.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.server.port }}
              protocol: TCP
          env:
            - name: JAVA_OPTS
              value: {{ .Values.server.javaOpts | quote }}
            - name: SPRING_PROFILES_ACTIVE
              value: "prod,distributed"
            - name: GIMI_DB_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gimi.secretName" . }}
                  key: postgres-url
            - name: GIMI_DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ include "gimi.secretName" . }}
                  key: postgres-username
            - name: GIMI_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gimi.secretName" . }}
                  key: postgres-password
            - name: GIMI_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ include "gimi.secretName" . }}
                  key: jwt-secret
            - name: GIMI_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "gimi.secretName" . }}
                  key: redis-url
            - name: GIMI_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "gimi.secretName" . }}
                  key: admin-password
          startupProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.server.port }}
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.server.port }}
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: {{ .Values.server.port }}
            periodSeconds: 5
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.server.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "gimi.fullname" . }}-server
  labels:
    {{- include "gimi.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.server.port }}
      targetPort: {{ .Values.server.port }}
      protocol: TCP
  selector:
    {{- include "gimi.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "gimi.fullname" . }}-server
  labels:
    {{- include "gimi.labels" . | nindent 4 }}
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "gimi.fullname" . }}-server
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "gimi.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
