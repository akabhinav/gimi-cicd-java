# ─────────────────────────────────────────────────────────────────────────────
# GIMI CI/CD Helm Values
# Override any value with --set or --values
# ─────────────────────────────────────────────────────────────────────────────

global:
  imageRegistry: ""
  imagePullSecrets: []

# ── Server ─────────────────────────────────────────────────────────────────
server:
  image:
    repository: gimi/gimi-server
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "2"
      memory: 2Gi
  javaOpts: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0"
  port: 8080
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── Worker ─────────────────────────────────────────────────────────────────
worker:
  image:
    repository: gimi/gimi-worker
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 3
  autoscaling:
    enabled: true
    minReplicas: 2
    maxReplicas: 50
    targetCPU: 70
    targetMemory: 80
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: "4"
      memory: 4Gi
  javaOpts: "-XX:+UseZGC -XX:MaxRAMPercentage=75.0"
  maxConcurrentJobs: 200
  nodeSelector: {}
  tolerations: []
  affinity: {}

# ── UI ─────────────────────────────────────────────────────────────────────
ui:
  enabled: true
  image:
    repository: gimi/gimi-ui
    tag: "latest"
    pullPolicy: IfNotPresent
  replicas: 2
  port: 80
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

# ── Ingress ────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  host: gimi.example.com
  tls:
    enabled: true
    secretName: gimi-tls
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod

# ── PostgreSQL ─────────────────────────────────────────────────────────────
postgresql:
  # Set to false to use an external database
  enabled: true
  image: postgres:16-alpine
  storage: 20Gi
  storageClass: ""
  resources:
    requests:
      cpu: 250m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi
  # External database config (when enabled: false)
  external:
    url: ""
    username: ""
    password: ""

# ── Redis ──────────────────────────────────────────────────────────────────
redis:
  # Set to false to use an external Redis
  enabled: true
  image: redis:7-alpine
  storage: 5Gi
  storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  # External Redis config (when enabled: false)
  external:
    url: ""

# ── Secrets ────────────────────────────────────────────────────────────────
secrets:
  # Set these in production! Auto-generated defaults are insecure.
  jwtSecret: ""
  adminPassword: ""
  webhookSecret: ""
  workerToken: ""
  # Use existing secret instead of creating one
  existingSecret: ""

# ── Monitoring ─────────────────────────────────────────────────────────────
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
  podMonitor:
    enabled: false

# ── Network Policies ───────────────────────────────────────────────────────
networkPolicy:
  enabled: true
