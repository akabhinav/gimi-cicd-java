server:
  port: 8081

gimi:
  worker:
    # CPU-aware default: cores * 4 (minimum 8). Override for your hardware.
    # For 10K pipelines across N workers: aim for 10000 / N jobs per worker.
    # Example: 50 workers with max-concurrent-jobs=200 = 10,000 concurrent jobs.
    max-concurrent-jobs: 0  # 0 = auto-detect (CPU cores * 4)
    poll-interval-ms: 500
    heartbeat-interval-ms: 3000
    redis-url: redis://localhost:6379
    server-url: http://localhost:8080
    worker-token: ""  # Set via GIMI_WORKER_WORKER_TOKEN env var. Derive from server JWT secret.
    labels:
      - default

spring:
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  metrics:
    tags:
      application: gimi-worker

logging:
  level:
    dev.gimi: INFO
