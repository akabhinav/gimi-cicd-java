services:
  # --- Infrastructure ---
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: gimi
      POSTGRES_USER: gimi
      POSTGRES_PASSWORD: ${GIMI_POSTGRES_PASSWORD:-gimi}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./gimi-engine/src/main/resources/db/migration/V1__init.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gimi"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # --- GIMI Server ---
  gimi-server:
    build:
      context: .
      dockerfile: Dockerfile
      target: server
    ports:
      - "8085:8085"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      GIMI_SERVER_DISTRIBUTED_MODE: "true"
      GIMI_SERVER_POSTGRES_URL: jdbc:postgresql://postgres:5432/gimi
      GIMI_SERVER_POSTGRES_USERNAME: gimi
      GIMI_SERVER_POSTGRES_PASSWORD: ${GIMI_POSTGRES_PASSWORD:-gimi}
      GIMI_SERVER_REDIS_URL: redis://redis:6379
      GIMI_SERVER_PIPELINE_DIR: /app/pipelines
      GIMI_SERVER_JWT_SECRET: "${GIMI_JWT_SECRET:-gimi-dev-secret-key-change-in-prod-at-least-32-bytes}"
      GIMI_SERVER_WEBHOOK_SECRET: ${GIMI_WEBHOOK_SECRET:-}
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    volumes:
      - ./pipelines:/app/pipelines
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8085/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- GIMI Workers (scale with --scale gimi-worker=N) ---
  gimi-worker:
    build:
      context: .
      dockerfile: Dockerfile
      target: worker
    environment:
      GIMI_WORKER_REDIS_URL: redis://redis:6379
      GIMI_WORKER_SERVER_URL: http://gimi-server:8085
      GIMI_WORKER_MAX_CONCURRENT_JOBS: "200"
    deploy:
      resources:
        limits:
          cpus: "4"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 512M
    depends_on:
      gimi-server:
        condition: service_healthy
      redis:
        condition: service_healthy

  # --- GIMI UI ---
  gimi-ui:
    build:
      context: ./gimi-ui
      dockerfile: Dockerfile
    ports:
      - "3001:80"
    depends_on:
      gimi-server:
        condition: service_healthy

volumes:
  pgdata:
