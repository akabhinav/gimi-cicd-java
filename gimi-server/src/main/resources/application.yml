server:
  port: 8085
  tomcat:
    threads:
      max: 400
      min-spare: 50
    max-connections: 20000
    accept-count: 500
    connection-timeout: 10000

gimi:
  server:
    pipeline-dir: ./pipelines
    webhook-secret: ""
    jwt-secret: gimi-dev-secret-key-change-in-prod-at-least-32-bytes
    default-admin-password: admin
    distributed-mode: false
    redis-url: redis://localhost:6379
    postgres-url: jdbc:postgresql://localhost:5432/gimi
    postgres-username: gimi
    postgres-password: gimi
    s3-bucket: gimi-artifacts
    s3-region: us-east-1
    s3-endpoint: ""
    cors-allowed-origins: ""  # Comma-separated list. Empty = localhost only (dev mode)

spring:
  application:
    name: gimi-server
  threads:
    virtual:
      enabled: true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,info,metrics
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,redis,postgres
  metrics:
    tags:
      application: gimi-server

logging:
  level:
    dev.gimi: INFO
    org.springframework.security: WARN
    com.zaxxer.hikari: INFO
