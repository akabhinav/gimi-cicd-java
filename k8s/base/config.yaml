apiVersion: v1
kind: ConfigMap
metadata:
  name: gimi-config
  namespace: gimi
data:
  cors-allowed-origins: "https://gimi.example.com"
---
# IMPORTANT: Replace placeholder values with real secrets before applying.
# In production, use an external secret manager (e.g., Sealed Secrets, External Secrets Operator, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: gimi-secrets
  namespace: gimi
type: Opaque
stringData:
  postgres-url: "jdbc:postgresql://postgres:5432/gimi"
  postgres-username: "gimi"
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  jwt-secret: "CHANGE_ME_MUST_BE_AT_LEAST_32_CHARACTERS_LONG"
  webhook-secret: "CHANGE_ME_WEBHOOK_SECRET"
  redis-url: "redis://redis:6379"
  admin-password: "CHANGE_ME_ADMIN_PASSWORD"
