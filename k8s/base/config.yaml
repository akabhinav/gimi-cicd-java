apiVersion: v1
kind: ConfigMap
metadata:
  name: gimi-config
  namespace: gimi
  labels:
    app.kubernetes.io/part-of: gimi-cicd
data:
  cors-allowed-origins: "https://gimi.example.com"
---
# IMPORTANT: This is a TEMPLATE. Do NOT commit real secrets.
# In production, use one of:
#   - External Secrets Operator (AWS Secrets Manager, GCP Secret Manager, Vault)
#   - Sealed Secrets (Bitnami)
#   - SOPS + age/KMS encryption
#
# To use External Secrets Operator, replace this Secret with an ExternalSecret:
#
#   apiVersion: external-secrets.io/v1beta1
#   kind: ExternalSecret
#   metadata:
#     name: gimi-secrets
#     namespace: gimi
#   spec:
#     refreshInterval: 1h
#     secretStoreRef:
#       name: vault-backend
#       kind: ClusterSecretStore
#     target:
#       name: gimi-secrets
#     data:
#       - secretKey: postgres-url
#         remoteRef:
#           key: gimi/database
#           property: url
#       # ... repeat for each key
#
apiVersion: v1
kind: Secret
metadata:
  name: gimi-secrets
  namespace: gimi
  labels:
    app.kubernetes.io/part-of: gimi-cicd
type: Opaque
stringData:
  postgres-url: "jdbc:postgresql://postgres:5432/gimi"
  postgres-username: "gimi"
  postgres-password: "CHANGE_ME_IN_PRODUCTION"
  jwt-secret: "CHANGE_ME_MUST_BE_AT_LEAST_32_CHARACTERS_LONG"
  webhook-secret: "CHANGE_ME_WEBHOOK_SECRET"
  redis-url: "redis://redis:6379"
  admin-password: "CHANGE_ME_ADMIN_PASSWORD"
  worker-token: "CHANGE_ME_DERIVE_FROM_JWT_SECRET"
