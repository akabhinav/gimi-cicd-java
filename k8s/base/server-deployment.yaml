apiVersion: apps/v1
kind: Deployment
metadata:
  name: gimi-server
  namespace: gimi
  labels:
    app.kubernetes.io/name: gimi-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gimi-cicd
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app.kubernetes.io/name: gimi-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gimi-server
        app.kubernetes.io/component: server
        app.kubernetes.io/part-of: gimi-cicd
    spec:
      serviceAccountName: gimi-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: gimi-server
      containers:
        - name: server
          image: gimi/server:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8085
              name: http
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
            - name: GIMI_SERVER_DISTRIBUTED_MODE
              value: "true"
            - name: GIMI_SERVER_POSTGRES_URL
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: postgres-url
            - name: GIMI_SERVER_POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: postgres-username
            - name: GIMI_SERVER_POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: postgres-password
            - name: GIMI_SERVER_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: jwt-secret
            - name: GIMI_SERVER_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: webhook-secret
            - name: GIMI_SERVER_REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: redis-url
            - name: GIMI_SERVER_DEFAULT_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: gimi-secrets
                  key: admin-password
            - name: GIMI_SERVER_CORS_ALLOWED_ORIGINS
              valueFrom:
                configMapKeyRef:
                  name: gimi-config
                  key: cors-allowed-origins
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=75.0 -XX:+UseZGC"
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 10
            failureThreshold: 3
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            periodSeconds: 5
            failureThreshold: 5
            timeoutSeconds: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: gimi-server
  namespace: gimi
  labels:
    app.kubernetes.io/name: gimi-server
    app.kubernetes.io/component: server
    app.kubernetes.io/part-of: gimi-cicd
spec:
  selector:
    app.kubernetes.io/name: gimi-server
  ports:
    - port: 8085
      targetPort: http
      protocol: TCP
      name: http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gimi-server
  namespace: gimi
  labels:
    app.kubernetes.io/name: gimi-server
    app.kubernetes.io/part-of: gimi-cicd
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: gimi-server
  namespace: gimi
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: gimi-server
