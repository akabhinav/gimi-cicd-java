apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: gimi-server
  namespace: gimi
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "100m"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - gimi.example.com
      secretName: gimi-tls
  rules:
    - host: gimi.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: gimi-server
                port:
                  number: 8080
